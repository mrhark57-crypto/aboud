name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/abboud/app
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/abboud/app/
          mv index.html app/src/main/assets/
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          E
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.abboud.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.abboud.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          E
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: abboud-apk
          path: app/build/outputs/apk/debug/app-debug.apk
